<text class="t tb" x="1060.0" y="150.0" font-size="24.0" text-anchor="start" dominant-baseline="central">THÔNG SỐ CẦU THANG</text>
<text class="t " x="1060.0" y="202.0" font-size="17.5" text-anchor="start" dominant-baseline="central">• Cầu thang 2 vế chữ U, chạy DỌC NHÀ (theo chiều sâu)</text>
<text class="t " x="1060.0" y="254.0" font-size="17.5" text-anchor="start" dominant-baseline="central">• Chân thang trong BẾP, đầu thang ra khu SHC tầng 2</text>
<text class="t " x="1060.0" y="306.0" font-size="17.5" text-anchor="start" dominant-baseline="central">• Tổng 22 bậc: h = 164 mm, b = 250 mm (2h + b = 578)</text>
<text class="t " x="1060.0" y="358.0" font-size="17.5" text-anchor="start" dominant-baseline="central">• Mỗi vế 11 bậc, rộng 1.000 mm, dài 2.500 mm</text>
<text class="t " x="1060.0" y="410.0" font-size="17.5" text-anchor="start" dominant-baseline="central">• Chiếu nghỉ 2.100 × 1.000 phía trước, cos +2.250</text>
<text class="t " x="1060.0" y="462.0" font-size="17.5" text-anchor="start" dominant-baseline="central">• Ô cầu thang 2,1 × 3,5 m nằm giữa trục 2 – 3</text>
<text class="t " x="1060.0" y="514.0" font-size="17.5" text-anchor="start" dominant-baseline="central">• Lan can kính, tay vịn gỗ, cao 900</text>
<text class="t " x="1060.0" y="566.0" font-size="17.5" text-anchor="start" dominant-baseline="central">• Giếng trời kính phía trên + ô thoáng chớp</text>
<text class="t " x="1060.0" y="618.0" font-size="17.5" text-anchor="start" dominant-baseline="central">  thoát khí nóng (hiệu ứng ống khói)</text>
