<style>
  :root{--ink:#1f1f1f;--muted:#6b6b6b;--acc:#b03a2e;--panel:rgba(255,255,255,.96)}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe9f1;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
            -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;touch-action:none}
  #top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;
       padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.75));
       box-shadow:0 1px 8px rgba(0,0,0,.08)}
  #top>div{flex:1;min-width:0}
  #top h1{font-size:16px;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #top .sub{font-size:12px;color:var(--muted)}
  #top a{flex:0 0 auto;font-size:13px;color:#1a4f9c;text-decoration:none;white-space:nowrap;border:1px solid #c9d6ea;
         border-radius:16px;padding:5px 10px;background:#fff}
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:8px;align-items:center;
       padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--panel);box-shadow:0 -2px 12px rgba(0,0,0,.12)}
  #views{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;-webkit-overflow-scrolling:touch}
  #views::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid #cfcfcf;background:#fff;border-radius:20px;padding:9px 14px;font:inherit;font-size:14px;
        color:var(--ink);cursor:pointer;min-height:40px}
  .chip.on{background:#262626;color:#fff;border-color:#262626}
  #optBtn{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid #cfcfcf;background:#fff;font-size:20px;cursor:pointer}
  #optBtn[aria-expanded="true"]{background:#262626;color:#fff}
  #sheet{position:fixed;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:11;width:280px;max-width:calc(100% - 20px);
         background:var(--panel);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:12px 16px;font-size:15px}
  #sheet[hidden]{display:none}
  #sheet h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#888;margin:2px 0 6px}
  #sheet label{display:flex;align-items:center;gap:10px;min-height:38px;cursor:pointer}
  #sheet input{width:20px;height:20px;accent-color:#262626}
  #png{width:100%;margin-top:8px;min-height:42px;border-radius:10px;border:1px solid #cfcfcf;background:#fff;font:inherit;cursor:pointer}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:9;
        background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:6px 12px;border-radius:14px;max-width:90vw;text-align:center;
        transition:opacity .6s;pointer-events:none}
  #hint.hide{opacity:0}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
       color:#333;font-size:15px;z-index:5}
  .lbl{background:rgba(255,255,255,.92);border:1px solid #bbb;border-radius:4px;padding:2px 6px;font-size:12px;
       font-weight:600;color:#222;white-space:nowrap;font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.25}
  .lbl small{display:block;font-weight:400;color:var(--acc);font-size:11px}
  body.shot #top,body.shot #bar,body.shot #sheet,body.shot #hint{display:none}
  @media (max-width:640px){
    #top h1{font-size:15px}
    #top .sub{display:none}
    .lbl{font-size:10px;padding:1px 4px}
    .lbl small{font-size:9px}
  }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="msg">Đang tải mô hình 3D…</div>
<header id="top">
  <div><h1>Nhà chú Ba – mô hình 3D</h1><div class="sub">2 tầng mái bằng · 6 × 15 m · sân trước 5 m</div></div>
  <a href="00_HO-SO-THIET-KE.html">Bản vẽ</a>
</header>
<div id="sheet" hidden>
  <h2>Hiển thị</h2>
  <label><input type="checkbox" id="c-roof" checked> Mái</label>
  <label><input type="checkbox" id="c-t2" checked> Tầng 2</label>
  <label><input type="checkbox" id="c-furn" checked> Nội thất</label>
  <label><input type="checkbox" id="c-lab"> Tên phòng</label>
  <label><input type="checkbox" id="c-cut"> Bỏ tường bên phải (xem bên trong)</label>

    <button class="chip" data-v="toancanh">Toàn cảnh</button>
    <button class="chip" data-v="tang1">Tầng 1</button>
    <button class="chip" data-v="tang2">Tầng 2</button>
    <button class="chip" data-v="catdoc">Cắt dọc nhà</button>
    <button class="chip" data-v="matsau">Mái &amp; giếng trời</button>
  </div>
  <button id="optBtn" aria-expanded="false" aria-controls="sheet" title="Tùy chọn hiển thị">⚙</button>
</nav>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// Toạ độ theo bản vẽ (mét): X = ngang lô 0..6 (X = 0 bên trái khi đứng ngoài đường nhìn vào), Z = sâu (mặt tiền Z = 0,
// sân trước Z < 0), Y = cao (sân ±0.000). Trục x của three.js = 6 − X để không bị lật gương.
const W = X => 6 - X;
const F1 = 0.45, S2 = 3.93, F2 = 4.05, R0 = 7.33, R1 = 7.45, PAR = 8.55, RISE = 3.6 / 22;
const isTouch = matchMedia('(pointer: coarse)').matches;
const small = Math.min(innerWidth, innerHeight) < 700;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe9f1);
const renderer = new THREE.WebGLRenderer({ antialias: !small, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, small ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.setSize(innerWidth, innerHeight);
Object.assign(labelR.domElement.style, { position: 'absolute', top: '0', pointerEvents: 'none' });
document.body.appendChild(labelR.domElement);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 4;
controls.maxDistance = 90;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

scene.add(new THREE.HemisphereLight(0xffffff, 0x8f8572, 0.95));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
sun.position.set(W(-14), 26, -18);
sun.target.position.set(W(3), 0, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.45);
fill.position.set(W(18), 14, 30);
scene.add(fill);

// ---------------------------------------------------------------- vật liệu
const M = (c, o = {}) => new THREE.MeshStandardMaterial({
  color: c, roughness: o.r ?? 0.85, metalness: o.m ?? 0,
  transparent: !!o.o, opacity: o.o ?? 1, depthWrite: o.o ? false : true });
const mat = {
  white: M(0xf6f4ee), wallIn: M(0xefebe3), dark: M(0x3a3a3a), coping: M(0x474747),
  stone: M(0x8e8a82), stoneDark: M(0x2f2f2f), wood: M(0x9a6a3c), woodL: M(0xb88a5c), woodTho: M(0xa0644a),
  glass: M(0x9cc7dd, { o: 0.32, r: 0.05, m: 0.2 }), glassRail: M(0xbfe0f0, { o: 0.25, r: 0.05 }),
  sky: M(0xbfe6f5, { o: 0.45, r: 0.05 }), slab: M(0xd9d5cc), roof: M(0xc98e6b),
  tileL: M(0xe9e3d8), tileK: M(0xe6dccb), woodF: M(0xc9a27a), wcTile: M(0xcfe3e6), red: M(0x8c3b2b),
  yard: M(0xd8d2c6), lawn: M(0xd9d5ca), road: M(0x6f7377), walk: M(0xc9c4ba), plant: M(0x6fa04a),
  plant2: M(0x86b85c), pot: M(0x9b9b95), metal: M(0x2b2b2b, { m: 0.4, r: 0.5 }), inox: M(0xcfd3d6, { m: 0.7, r: 0.3 }),
  fabric: M(0x8d99a6), fabric2: M(0xd8cfc0), bed: M(0xf2f0ea), ghost: M(0xd9d4ca, { o: 0.35 }), cab: M(0xf0ece4),
};

// ---------------------------------------------------------------- nhóm hiển thị
const G = {};
['site', 't1', 't1R', 't2', 't2R', 'roof', 'roofR', 'f1', 'f2', 'lab1', 'lab2', 'labR', 'nb']
  .forEach(k => { G[k] = new THREE.Group(); scene.add(G[k]); });

function box(g, x0, x1, z0, z1, y0, y1, m, shadow = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), m);
  mesh.position.set(W((x0 + x1) / 2), (y0 + y1) / 2, (z0 + z1) / 2);
  mesh.castShadow = shadow && !m.transparent;
  mesh.receiveShadow = true;
  g.add(mesh);
  return mesh;
}
function cyl(g, x, z, y0, h, r, m, seg = 20) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), m);
  mesh.position.set(W(x), y0 + h / 2, z);
  mesh.castShadow = mesh.receiveShadow = true;
  g.add(mesh);
}
function ball(g, x, z, y, r, m) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m);
  mesh.position.set(W(x), y, z);
  mesh.castShadow = true;
  g.add(mesh);
}
// tường chạy theo phương X (dày theo Z); ô cửa {a, b, y0, y1, glass}
function wallX(g, x0, x1, z0, z1, y0, y1, ops, m) {
  let c = x0;
  for (const o of [...ops].sort((p, q) => p.a - q.a)) {
    if (o.a > c) box(g, c, o.a, z0, z1, y0, y1, m);
    if (o.y0 > y0) box(g, o.a, o.b, z0, z1, y0, o.y0, m);
    if (o.y1 < y1) box(g, o.a, o.b, z0, z1, o.y1, y1, m);
    if (o.glass) box(g, o.a, o.b, (z0 + z1) / 2 - 0.01, (z0 + z1) / 2 + 0.01, o.y0, o.y1, mat.glass);
    c = o.b;
  }
  if (c < x1) box(g, c, x1, z0, z1, y0, y1, m);
}
// tường chạy theo phương Z (dày theo X)
function wallZ(g, x0, x1, z0, z1, y0, y1, ops, m) {
  let c = z0;
  for (const o of [...ops].sort((p, q) => p.a - q.a)) {
    if (o.a > c) box(g, x0, x1, c, o.a, y0, y1, m);
    if (o.y0 > y0) box(g, x0, x1, o.a, o.b, y0, o.y0, m);
    if (o.y1 < y1) box(g, x0, x1, o.a, o.b, o.y1, y1, m);
    c = o.b;
  }
  if (c < z1) box(g, x0, x1, c, z1, y0, y1, m);
}
function label(g, x, z, y, name, area) {
  const d = document.createElement('div');
  d.className = 'lbl';
  d.innerHTML = name + (area ? '<small>' + area + '</small>' : '');
  const o = new CSS2DObject(d);
  o.position.set(W(x), y, z);
  g.add(o);
}
// khối phía sau dùng chung 2 tầng: hành lang trái, WC giữa, phòng ngủ phải, sân phơi
function rearBlock(g, f, top, zFront) {
  const dh = f + 2.2;
  wallZ(g, 1.2, 1.3, zFront, 12.7, f, top, [{ a: 9.6, b: 10.3, y0: f, y1: dh }, { a: 11.95, b: 12.65, y0: f, y1: dh }], mat.wallIn);
  box(g, 2.7, 2.8, zFront, 12.7, f, top, mat.wallIn);
  box(g, 1.3, 2.7, 11.8, 11.9, f, top, mat.wallIn);
  wallX(g, 0.2, 5.8, 12.7, 12.8, f, top,
    [{ a: 0.3, b: 1.1, y0: f, y1: dh }, { a: 3.6, b: 5.2, y0: f + 0.9, y1: f + 2.4, glass: true }], mat.wallIn);
}
function wcFurniture(g, f) {
  box(g, 2.2, 2.7, 9.5, 10.1, f, f + 0.85, mat.white);
  box(g, 2.25, 2.7, 10.4, 10.9, f, f + 0.42, mat.white);
  box(g, 1.3, 2.7, 10.93, 10.97, f, f + 2.0, mat.glass);
}

// ---------------------------------------------------------------- khu đất, sân
box(G.site, -25, 31, -30, -7, -0.25, -0.15, mat.road, false);
for (let x = -25; x < 31; x += 3) box(G.site, x, x + 1.5, -11.2, -11.0, -0.15, -0.149, mat.white, false);
box(G.site, -25, 31, -7, -5, -0.25, 0, mat.walk, false);
box(G.site, -25, 31, -5, 40, -0.25, 0, mat.lawn, false);
box(G.site, 0.1, 5.9, -4.85, 0, 0, 0.01, mat.yard, false);
for (const x of [0.4, 5.6]) for (const z of [-4.3, -3.3, -2.3, -1.4]) {
  box(G.site, x - 0.3, x + 0.3, z - 0.3, z + 0.3, 0, 0.3, mat.pot);
  ball(G.site, x, z, 0.62, 0.33, mat.plant);
}
box(G.site, 0, 0.1, -5, 0, 0, 1.4, mat.white);
box(G.site, 5.9, 6, -5, 0, 0, 1.4, mat.white);
box(G.site, 0, 1, -5, -4.8, 0, 1.8, mat.white);
box(G.site, 5, 6, -5, -4.8, 0, 1.8, mat.white);
box(G.site, 0, 1, -5.02, -4.78, 1.8, 1.88, mat.dark);
box(G.site, 5, 6, -5.02, -4.78, 1.8, 1.88, mat.dark);
for (let y = 0.25; y < 1.6; y += 0.16) box(G.site, 3.6, 5.0, -4.95, -4.92, y, y + 0.07, mat.metal);
box(G.site, 0.7, 3.3, -0.9, 0, 0, 0.15, mat.stoneDark);
box(G.site, 0.7, 3.3, -0.6, 0, 0.15, 0.3, mat.stoneDark);
box(G.site, 0.7, 3.3, -0.3, 0, 0.3, 0.45, mat.stoneDark);
cyl(G.site, 9.5, -6, 0, 3.2, 0.12, mat.woodL);
ball(G.site, 9.5, -6, 4.2, 1.5, mat.plant);
cyl(G.site, -7, -6, 0, 3.0, 0.12, mat.woodL);
ball(G.site, -7, -6, 4.0, 1.4, mat.plant2);
box(G.nb, -7, 0, 0, 15, 0, 7.0, mat.ghost, false);
box(G.nb, 6, 13, 0, 15, 0, 7.4, mat.ghost, false);

// ---------------------------------------------------------------- TẦNG 1
box(G.t1, 0, 6, 0, 15, 0, F1, mat.slab);
box(G.t1, 0, 6, -0.02, 0, 0, F1, mat.stoneDark);
[[0.2, 5.8, 0.2, 3.7, mat.tileL], [0.2, 5.8, 3.7, 9.3, mat.tileK], [2.8, 5.8, 9.4, 12.7, mat.woodF],
 [1.3, 2.7, 9.4, 11.8, mat.wcTile], [0.2, 1.2, 9.3, 12.7, mat.tileL], [0.2, 5.8, 12.8, 14.8, mat.yard]]
  .forEach(([a, b, c, d, m]) => box(G.t1, a, b, c, d, F1, F1 + 0.01, m, false));
box(G.t1, 0, 0.2, 0, 15, F1, F2, mat.white);
box(G.t1R, 5.8, 6, 0, 15, F1, F2, mat.white);
wallX(G.t1, 0.2, 5.8, 0, 0.2, F1, S2,
  [{ a: 0.8, b: 3.2, y0: F1, y1: 3.45, glass: true }, { a: 3.8, b: 5.4, y0: 1.25, y1: 3.45, glass: true }], mat.white);
box(G.t1, 0, 0.7, -0.08, 0, F1, 3.85, mat.stone);
box(G.t1, 0.15, 0.55, -0.1, -0.08, 2.55, 2.85, mat.dark);
box(G.t1, 3.7, 5.5, -0.12, 0, 1.15, 1.25, mat.dark);
wallX(G.t1, 0.2, 5.8, 14.8, 15, F1, F2, [{ a: 3.6, b: 5.2, y0: 1.35, y1: 2.85 }], mat.white);
wallX(G.t1, 1.2, 5.8, 9.3, 9.4, F1, S2, [{ a: 2.9, b: 3.7, y0: F1, y1: 2.65 }], mat.wallIn);
rearBlock(G.t1, F1, S2, 9.4);
// cầu thang chữ U chạy dọc nhà: vế 1 (X 4.8–5.8) bắt đầu trong bếp ở Z = 7.2, chiếu nghỉ phía trước (Z 3.7–4.7),
// vế 2 (X 3.7–4.7) quay lại, lên tới khu sinh hoạt chung tầng 2 ở Z = 7.2
for (let i = 1; i <= 10; i++) {
  box(G.t1, 4.8, 5.8, 7.2 - 0.25 * i, 7.2 - 0.25 * (i - 1), F1, F1 + i * RISE, mat.woodL);
  const top = 2.25 + i * RISE;
  box(G.t1, 3.7, 4.7, 4.7 + 0.25 * (i - 1), 4.7 + 0.25 * i, top - 0.32, top, mat.woodL);
}
box(G.t1, 3.7, 4.7, 6.95, 7.2, 4.05 - 0.32, F2, mat.woodL);
box(G.t1, 3.7, 5.8, 3.7, 4.7, 2.1, 2.25, mat.woodL);
box(G.t1, 4.7, 4.8, 4.7, 7.2, F1, 3.0, mat.wallIn);
box(G.t1, 3.7, 3.74, 4.7, 7.2, 2.4, 3.3, mat.glassRail);
// nội thất tầng 1
const f1 = G.f1;
box(f1, 3.7, 5.8, 3.7, 4.7, F1, 2.1, mat.cab);
box(f1, 4.95, 5.75, 0.8, 3.3, F1, F1 + 0.42, mat.fabric);
box(f1, 5.55, 5.75, 0.8, 3.3, F1, F1 + 0.8, mat.fabric);
box(f1, 3.5, 4.4, 1.5, 2.6, F1, F1 + 0.4, mat.woodL);
box(f1, 0.2, 0.6, 1.1, 3.1, F1, F1 + 0.5, mat.cab);
box(f1, 0.22, 0.3, 1.5, 2.7, F1 + 1.0, F1 + 1.75, mat.dark);
box(f1, 0.2, 0.55, 0.35, 1.0, F1, F1 + 1.1, mat.cab);
box(f1, 1.4, 2.3, 4.6, 6.2, F1 + 0.72, F1 + 0.76, mat.woodL);
box(f1, 1.75, 1.95, 5.3, 5.5, F1, F1 + 0.72, mat.metal);
for (const z of [4.7, 5.2, 5.7]) { box(f1, 1.0, 1.35, z, z + 0.4, F1, F1 + 0.45, mat.wood); box(f1, 2.35, 2.7, z, z + 0.4, F1, F1 + 0.45, mat.wood); }
box(f1, 1.3, 4.6, 8.7, 9.3, F1, F1 + 0.85, mat.cab);
box(f1, 1.3, 4.6, 8.7, 9.3, F1 + 0.85, F1 + 0.88, mat.stoneDark);
box(f1, 1.3, 4.6, 8.95, 9.3, F1 + 1.55, F1 + 2.25, mat.cab);
box(f1, 4.7, 5.4, 8.6, 9.3, F1, F1 + 1.8, mat.inox);
box(f1, 3.8, 5.8, 11.0, 12.6, F1, F1 + 0.5, mat.bed);
box(f1, 5.6, 5.8, 11.0, 12.6, F1, F1 + 1.0, mat.wood);
box(f1, 2.8, 3.4, 11.0, 12.6, F1, F1 + 2.2, mat.woodL);
wcFurniture(f1, F1);
box(f1, 1.4, 2.0, 12.9, 13.5, F1, F1 + 0.85, mat.white);
ball(f1, 0.5, 14.45, F1 + 0.4, 0.35, mat.plant);

const st = { roof: true, t2: true, furn: true, lab: false, cut: false, nb: false };
const VIEWS = {
  mattien:  { pos: [-9, 3.6, -21],  tgt: [3, 3.8, 1],   s: { roof: true, t2: true, lab: false, cut: false } },
  toancanh: { pos: [-15, 21, -15],  tgt: [3, 2.5, 6],   s: { roof: true, t2: true, lab: false, cut: false } },
  tang1:    { pos: [15, 17, 0],     tgt: [3, 0.5, 7.2], s: { roof: false, t2: false, lab: true, cut: true } },
  tang2:    { pos: [15, 20.5, 0.5], tgt: [3, 4, 7.2],   s: { roof: false, t2: true, lab: true, cut: true } },
  catdoc:   { pos: [19, 8.5, 2],    tgt: [3, 3.8, 7.5], s: { roof: true, t2: true, lab: true, cut: true } },
  matsau:   { pos: [9, 24, 27],     tgt: [3, 5, 9],     s: { roof: true, t2: true, lab: true, cut: false } },
};
const cb = id => document.getElementById(id);
function apply() {
  const roofOn = st.roof && st.t2;
  G.t2.visible = st.t2;
  G.t2R.visible = st.t2 && !st.cut;
  G.t1R.visible = !st.cut;
  G.roof.visible = roofOn;
  G.roofR.visible = roofOn && !st.cut;
  G.f1.visible = st.furn;
  G.f2.visible = st.furn && st.t2;
  G.nb.visible = st.nb;
  const show = (g, v) => g.children.forEach(o => { o.visible = v; });
  show(G.lab1, st.lab && (!st.t2 || (st.cut && roofOn)));
  show(G.lab2, st.lab && st.t2 && (!roofOn || st.cut));
  show(G.labR, st.lab && roofOn && !st.cut);
  cb('c-roof').checked = st.roof; cb('c-t2').checked = st.t2; cb('c-furn').checked = st.furn;
  cb('c-lab').checked = st.lab; cb('c-cut').checked = st.cut; cb('c-nb').checked = st.nb;
}
let current = null, touched = false;
function setView(name) {
  const v = VIEWS[name];
  if (!v) return;
  current = name;
  touched = false;
  // màn hình dọc (điện thoại) hẹp hơn → lùi camera ra xa để vẫn thấy trọn ngôi nhà
  const k = camera.aspect < 1.3 ? Math.min(3.2, Math.max(1, 1.45 / camera.aspect)) : 1;
  const t = new THREE.Vector3(W(v.tgt[0]), v.tgt[1], v.tgt[2]);
  const p = new THREE.Vector3(W(v.pos[0]), v.pos[1], v.pos[2]).sub(t).multiplyScalar(k).add(t);
  camera.position.copy(p);
  controls.target.copy(t);
  Object.assign(st, v.s);
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.v === name));
  apply();
}
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
[['c-roof', 'roof'], ['c-t2', 't2'], ['c-furn', 'furn'], ['c-lab', 'lab'], ['c-cut', 'cut'], ['c-nb', 'nb']]
  .forEach(([id, key]) => cb(id).addEventListener('change', e => {
    st[key] = e.target.checked;
    document.querySelectorAll('.chip').forEach(b => b.classList.remove('on'));
    apply();
  }));
const sheet = cb('sheet'), optBtn = cb('optBtn');
optBtn.addEventListener('click', () => {
  sheet.hidden = !sheet.hidden;
  optBtn.setAttribute('aria-expanded', String(!sheet.hidden));
});
renderer.domElement.addEventListener('pointerdown', () => {
  if (!sheet.hidden) { sheet.hidden = true; optBtn.setAttribute('aria-expanded', 'false'); }
});
controls.addEventListener('start', () => { touched = true; cb('hint').classList.add('hide'); });
cb('png').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'nha-chu-ba-3d.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
});
if (isTouch) cb('hint').textContent = '1 ngón: xoay · 2 ngón: phóng to / di chuyển';
setTimeout(() => cb('hint').classList.add('hide'), 6000);

const hash = new URLSearchParams(location.hash.slice(1));
if (hash.has('shot')) document.body.classList.add('shot');
setView(hash.get('v') || 'toancanh');
cb('msg').remove();

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelR.setSize(innerWidth, innerHeight);
  if (!touched && current) setView(current);   // xoay ngang/dọc điện thoại: canh lại khung nhìn nếu người xem chưa tự xoay
}
addEventListener('resize', resize);
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  labelR.render(scene, camera);
});
