<text class="t ti" x="45.0" y="1314.0" font-size="15.0" text-anchor="start" dominant-baseline="central">Thiết kế sơ bộ (phương án kiến trúc) – lập bởi KTS AI Claude. Kích thước tính bằng mm, cao độ tính bằng m. Hồ sơ thi công cần được kỹ sư kết cấu/M&amp;E có chứng chỉ hành nghề thẩm tra, ký duyệt.</text>
<text class="t " x="45.0" y="1284.0" font-size="16.0" text-anchor="start" dominant-baseline="central">Ranh giới lô đất thể hiện nét chấm gạch đỏ. Vị trí bể nước ngầm 3 m³ dưới sân trước, bể tự hoại dưới sân phơi tầng 1.</text>
